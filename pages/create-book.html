<!-- ================================================== -->
<!-- 封面手动裁剪弹窗 -->
<!-- ================================================== -->
<div
    class="cover-crop-modal"
    id="cover-crop-modal"
    hidden
>
    <!-- 背景遮罩 -->
    <div
        class="cover-crop-modal__backdrop"
        id="cover-crop-backdrop"
        aria-hidden="true"
    ></div>

    <!-- 裁剪面板 -->
    <section
        class="cover-crop-dialog"
        id="cover-crop-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cover-crop-title"
        aria-describedby="cover-crop-instructions"
        tabindex="-1"
    >
        <!-- 标题 -->
        <header class="cover-crop-dialog__header">
            <div>
                <p class="cover-crop-dialog__eyebrow">
                    BOOK COVER
                </p>

                <h2
                    class="cover-crop-dialog__title"
                    id="cover-crop-title"
                >裁剪封面</h2>
            </div>

            <button
                class="cover-crop-dialog__close"
                id="cover-crop-close"
                type="button"
                aria-label="关闭裁剪窗口"
            >×</button>
        </header>

        <!-- 操作说明 -->
        <p
            class="cover-crop-dialog__instructions"
            id="cover-crop-instructions"
        >
            拖动图片调整显示位置，使用下方滑块缩放图片。
            裁剪框固定为 2:3 比例，确认后生成统一尺寸的封面。
        </p>

        <!-- 固定 2:3 裁剪区域 -->
        <div
            class="cover-crop-stage"
            id="cover-crop-stage"
            aria-label="封面裁剪区域"
        >
            <img
                class="cover-crop-image"
                id="cover-crop-image"
                alt="正在裁剪的封面图片"
                draggable="false"
            >

            <!-- 三分辅助线 -->
            <div
                class="cover-crop-grid"
                aria-hidden="true"
            ></div>
        </div>

        <!-- 比例说明 -->
        <div class="cover-crop-ratio">
            <span class="cover-crop-ratio__label">
                封面比例
            </span>

            <span class="cover-crop-ratio__value">
                2 : 3
            </span>

            <span class="cover-crop-ratio__size">
                400 × 600
            </span>
        </div>

        <!-- 缩放控制 -->
        <div class="cover-crop-zoom">
            <label
                class="cover-crop-zoom__label"
                for="cover-crop-zoom"
            >
                图片缩放
            </label>

            <div class="cover-crop-zoom__controls">
                <button
                    class="cover-crop-zoom__icon"
                    id="cover-crop-zoom-out"
                    type="button"
                    aria-label="缩小图片"
                >−</button>

                <input
                    class="cover-crop-zoom__slider"
                    id="cover-crop-zoom"
                    type="range"
                    min="1"
                    max="3"
                    step="0.01"
                    value="1"
                    aria-label="调整封面图片缩放比例"
                >

                <button
                    class="cover-crop-zoom__icon"
                    id="cover-crop-zoom-in"
                    type="button"
                    aria-label="放大图片"
                >＋</button>
            </div>

            <output
                class="cover-crop-zoom__value"
                id="cover-crop-zoom-value"
                for="cover-crop-zoom"
            >100%</output>
        </div>

        <!-- 裁剪操作 -->
        <div class="cover-crop-dialog__actions">
            <button
                class="cover-crop-button cover-crop-button--reset"
                id="cover-crop-reset"
                type="button"
            >重置</button>

            <div class="cover-crop-dialog__actions-right">
                <button
                    class="cover-crop-button cover-crop-button--cancel"
                    id="cover-crop-cancel"
                    type="button"
                >取消</button>

                <button
                    class="cover-crop-button cover-crop-button--confirm"
                    id="cover-crop-confirm"
                    type="button"
                >确认裁剪</button>
            </div>
        </div>

        <!-- 裁剪错误提示 -->
        <p
            class="cover-crop-dialog__error"
            id="cover-crop-error"
            role="alert"
            hidden
        ></p>
    </section>
</div>
