<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9E2428">
    <meta name="description" content="创建新书籍，填写书名并选择专属封面。">

    <title>新建书籍 - 写作软件</title>

    <!-- 公共样式 -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- 新建书籍页面样式 -->
    <link rel="stylesheet" href="../page-css/create-book.css">

    <!-- 本页面统一配色 -->
    <style>
        :root {
            /* 赤色 */
            --create-book-red: #9E2428;
            --create-book-red-hover: #7F1D21;
            --create-book-red-active: #68171B;
            --create-book-red-pale: #FBF0F0;
            --create-book-red-light: #F4DEDF;

            /* 青色 */
            --create-book-cyan: #159E91;
            --create-book-cyan-hover: #107F75;
            --create-book-cyan-active: #0B6B63;
            --create-book-cyan-pale: #F0FAF9;
            --create-book-cyan-light: #E2F4F1;

            /* 白色 */
            --create-book-white: #FFFFFF;
        }

        /* =====================================
           顶部导航：返回按钮
           白色背景、赤色文字
        ===================================== */

        #cancel-create-book-top {
            background: var(--create-book-white) !important;
            background-color: var(--create-book-white) !important;

            color: var(--create-book-red) !important;
            -webkit-text-fill-color: var(--create-book-red) !important;

            border: 1px solid var(--create-book-red) !important;
            box-shadow: none !important;
            opacity: 1 !important;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        #cancel-create-book-top:hover {
            background: var(--create-book-red-pale) !important;
            background-color: var(--create-book-red-pale) !important;

            color: var(--create-book-red-hover) !important;
            -webkit-text-fill-color: var(--create-book-red-hover) !important;

            border-color: var(--create-book-red-hover) !important;
        }

        #cancel-create-book-top:active {
            background: var(--create-book-red-light) !important;
            background-color: var(--create-book-red-light) !important;

            border-color: var(--create-book-red-active) !important;
        }

        #cancel-create-book-top:focus-visible {
            outline: 2px solid var(--create-book-red) !important;
            outline-offset: 3px;
        }

        /* =====================================
           创建书籍按钮
           青色背景、白色文字
        ===================================== */

        #create-book-submit {
            background: var(--create-book-cyan) !important;
            background-color: var(--create-book-cyan) !important;

            color: var(--create-book-white) !important;
            -webkit-text-fill-color: var(--create-book-white) !important;

            border: 1px solid var(--create-book-cyan) !important;
            box-shadow: none !important;
            opacity: 1;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        #create-book-submit *,
        #create-book-submit span {
            color: var(--create-book-white) !important;
            -webkit-text-fill-color: var(--create-book-white) !important;
        }

        #create-book-submit:hover {
            background: var(--create-book-cyan-hover) !important;
            background-color: var(--create-book-cyan-hover) !important;

            border-color: var(--create-book-cyan-hover) !important;
        }

        #create-book-submit:active {
            background: var(--create-book-cyan-active) !important;
            background-color: var(--create-book-cyan-active) !important;

            border-color: var(--create-book-cyan-active) !important;
        }

        #create-book-submit:focus-visible {
            outline: 2px solid var(--create-book-cyan) !important;
            outline-offset: 3px;
        }

        #create-book-submit:disabled {
            background: var(--create-book-cyan) !important;
            background-color: var(--create-book-cyan) !important;

            color: var(--create-book-white) !important;
            -webkit-text-fill-color: var(--create-book-white) !important;

            border-color: var(--create-book-cyan) !important;
            opacity: 0.65 !important;
            cursor: not-allowed;
        }

        /* =====================================
           取消按钮
           白色背景、赤色文字
        ===================================== */

        #cancel-create-book {
            background: var(--create-book-white) !important;
            background-color: var(--create-book-white) !important;

            color: var(--create-book-red) !important;
            -webkit-text-fill-color: var(--create-book-red) !important;

            border: 1px solid var(--create-book-red) !important;
            box-shadow: none !important;
            opacity: 1 !important;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        #cancel-create-book *,
        #cancel-create-book span {
            color: var(--create-book-red) !important;
            -webkit-text-fill-color: var(--create-book-red) !important;
        }

        #cancel-create-book:hover {
            background: var(--create-book-red-pale) !important;
            background-color: var(--create-book-red-pale) !important;

            color: var(--create-book-red-hover) !important;
            -webkit-text-fill-color: var(--create-book-red-hover) !important;

            border-color: var(--create-book-red-hover) !important;
        }

        #cancel-create-book:active {
            background: var(--create-book-red-light) !important;
            background-color: var(--create-book-red-light) !important;

            border-color: var(--create-book-red-active) !important;
        }

        #cancel-create-book:focus-visible {
            outline: 2px solid var(--create-book-red) !important;
            outline-offset: 3px;
        }

        /* =====================================
           选择封面按钮
           青色背景、白色文字
        ===================================== */

        .create-book-cover__select-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            background: var(--create-book-cyan) !important;
            background-color: var(--create-book-cyan) !important;

            color: var(--create-book-white) !important;
            -webkit-text-fill-color: var(--create-book-white) !important;

            border: 1px solid var(--create-book-cyan) !important;
            border-radius: 8px;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .create-book-cover__select-button *,
        .create-book-cover__select-button span,
        #cover-select-label {
            color: var(--create-book-white) !important;
            -webkit-text-fill-color: var(--create-book-white) !important;
        }

        .create-book-cover__select-button:hover {
            background: var(--create-book-cyan-hover) !important;
            background-color: var(--create-book-cyan-hover) !important;

            border-color: var(--create-book-cyan-hover) !important;
        }

        .create-book-cover__select-button:active {
            background: var(--create-book-cyan-active) !important;
            background-color: var(--create-book-cyan-active) !important;

            border-color: var(--create-book-cyan-active) !important;
        }

        .create-book-cover__select-button:focus-within {
            outline: 2px solid var(--create-book-cyan) !important;
            outline-offset: 3px;
        }

        /* =====================================
           必填标记：赤色
        ===================================== */

        .create-book-field__required {
            color: var(--create-book-red) !important;
            -webkit-text-fill-color: var(--create-book-red) !important;
        }

        /* =====================================
           输入框聚焦：赤色边框
        ===================================== */

        .create-book-field__input:focus {
            border-color: var(--create-book-red) !important;
            outline-color: var(--create-book-red) !important;

            box-shadow:
                0 0 0 3px rgba(158, 36, 40, 0.12) !important;
        }

        /* =====================================
           减少动态效果
        ===================================== */

        @media (prefers-reduced-motion: reduce) {
            #cancel-create-book-top,
            #cancel-create-book,
            #create-book-submit,
            .create-book-cover__select-button {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
<div id="app">

    <!-- 顶部导航 -->
    <header class="app-header" id="app-header">
        <div class="app-header__brand">
            <span class="app-header__brand-name">写作软件</span>
        </div>

        <div class="app-header__actions">
            <button
                class="app-header__button app-header__button--settings"
                id="cancel-create-book-top"
                type="button"
            >
                ← 返回
            </button>
        </div>
    </header>

    <!-- 页面主体 -->
    <main class="app-main create-book-main">
        <section
            class="create-book-page"
            aria-labelledby="create-book-title"
        >

            <!-- 页面标题 -->
            <div class="create-book-heading">
                <p class="create-book-heading__eyebrow">NEW BOOK</p>

                <h1
                    class="create-book-heading__title"
                    id="create-book-title"
                >
                    新建书籍
                </h1>

                <div
                    class="create-book-heading__divider"
                    aria-hidden="true"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <p class="create-book-heading__description">
                    为你的故事取一个名字，选择一张专属封面。
                </p>
            </div>

            <!-- 新建书籍表单 -->
            <form
                class="create-book-form"
                id="create-book-form"
                novalidate
            >

                <!-- 书籍封面 -->
                <section
                    class="create-book-section create-book-cover-section"
                    aria-labelledby="cover-section-title"
                >
                    <div class="create-book-section__heading">
                        <h2
                            class="create-book-section__title"
                            id="cover-section-title"
                        >
                            书籍封面
                        </h2>

                        <span class="create-book-section__optional">
                            选填
                        </span>
                    </div>

                    <div class="create-book-cover">

                        <!-- 封面预览 -->
                        <div
                            class="create-book-cover__preview"
                            id="cover-preview"
                        >
                            <div
                                class="create-book-cover__placeholder"
                                id="cover-placeholder"
                            >
                                <svg
                                    class="create-book-cover__icon"
                                    viewBox="0 0 64 64"
                                    fill="none"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M15 7.5H40L50 17.5V55.5H15V7.5Z"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linejoin="round"
                                    />

                                    <path
                                        d="M40 7.5V18H50"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linejoin="round"
                                    />

                                    <path
                                        d="M23 29H42"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M23 36H42"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M23 43H36"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />
                                </svg>

                                <span class="create-book-cover__placeholder-title">
                                    尚未选择封面
                                </span>

                                <span class="create-book-cover__placeholder-description">
                                    让每一个故事拥有自己的面貌
                                </span>
                            </div>

                            <img
                                class="create-book-cover__image"
                                id="cover-preview-image"
                                alt="书籍封面预览"
                                hidden
                            >
                        </div>

                        <!-- 封面操作 -->
                        <div class="create-book-cover__actions">
                            <label
                                class="create-book-cover__select-button"
                                for="book-cover-input"
                            >
                                <span aria-hidden="true">＋</span>
                                <span id="cover-select-label">选择封面</span>
                            </label>

                            <button
                                class="create-book-cover__remove-button"
                                id="remove-cover-button"
                                type="button"
                                hidden
                            >
                                移除封面
                            </button>
                        </div>

                        <p
                            class="create-book-cover__help"
                            id="cover-help"
                        >
                            支持常见图片格式，建议使用清晰的竖版封面。
                        </p>

                        <!-- 图片输入 -->
                        <input
                            class="create-book-cover__input"
                            id="book-cover-input"
                            name="cover"
                            type="file"
                            accept="image/*"
                            aria-describedby="cover-help cover-error"
                        >

                        <p
                            class="create-book-cover__error"
                            id="cover-error"
                            role="alert"
                            hidden
                        ></p>
                    </div>
                </section>

                <!-- 基本信息 -->
                <section
                    class="create-book-section create-book-info-section"
                    aria-labelledby="info-section-title"
                >
                    <div class="create-book-section__heading">
                        <h2
                            class="create-book-section__title"
                            id="info-section-title"
                        >
                            基本信息
                        </h2>
                    </div>

                    <!-- 书名 -->
                    <div class="create-book-field">
                        <label
                            class="create-book-field__label"
                            for="book-title"
                        >
                            书名
                            <span
                                class="create-book-field__required"
                                aria-hidden="true"
                            >*</span>
                        </label>

                        <input
                            class="create-book-field__input"
                            id="book-title"
                            name="title"
                            type="text"
                            placeholder="请输入书名"
                            maxlength="100"
                            autocomplete="off"
                            required
                            aria-describedby="book-title-help book-title-error"
                        >

                        <div class="create-book-field__footer">
                            <p
                                class="create-book-field__help"
                                id="book-title-help"
                            >
                                一个好名字，是故事的开始。
                            </p>

                            <span
                                class="create-book-field__counter"
                                id="book-title-counter"
                            >
                                0 / 100
                            </span>
                        </div>

                        <p
                            class="create-book-field__error"
                            id="book-title-error"
                            role="alert"
                            hidden
                        ></p>
                    </div>
                </section>

                <!-- 操作结果提示 -->
                <div
                    class="create-book-message"
                    id="create-book-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <!-- 操作按钮 -->
                <div class="create-book-actions">
                    <button
                        class="create-book-actions__button create-book-actions__button--cancel"
                        id="cancel-create-book"
                        type="button"
                    >
                        取消
                    </button>

                    <button
                        class="create-book-actions__button create-book-actions__button--submit"
                        id="create-book-submit"
                        type="submit"
                    >
                        <span aria-hidden="true">＋</span>
                        创建书籍
                    </button>
                </div>

                <p class="create-book-footnote">
                    创建后，你可以继续为这部作品添加章节、人物与世界观。
                </p>
            </form>
        </section>
    </main>

    <!-- 底部导航 -->
    <footer class="app-footer" id="app-footer">
        <nav class="bottom-nav" aria-label="主导航">

            <!-- 书架 -->
            <a
                class="bottom-nav__item"
                href="../index.html"
                data-nav="home"
            >
                <span class="bottom-nav__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path
                            d="M3 10.5L12 3L21 10.5"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M5.5 9.5V21H18.5V9.5"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M9 21V14H15V21"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linejoin="round"
                        />
                    </svg>
                </span>

                <span class="bottom-nav__label">书架</span>
            </a>

            <!-- 工具 -->
            <a
                class="bottom-nav__item"
                href="./tools.html"
                data-nav="tools"
            >
                <span class="bottom-nav__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path
                            d="M4 5H10V11H4V5Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M14 5H20V11H14V5Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M4 15H10V21H4V15Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M14 15H20V21H14V15Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linejoin="round"
                        />
                    </svg>
                </span>

                <span class="bottom-nav__label">工具</span>
            </a>
        </nav>
    </footer>

</div>

<!-- 公共数据与导航接口 -->
<script src="../js/storage.js" defer></script>
<script src="../js/navigation.js" defer></script>
<script src="../js/components.js" defer></script>

<!-- 新建书籍页面逻辑 -->
<script src="../page-js/create-book.js" defer></script>

</body>
</html>
