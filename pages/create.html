<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#9E2428"
  >

  <meta
    name="description"
    content="创建你的新作品，开启全新的写作旅程。"
  >

  <title>新建作品 - 写作软件</title>


  <!-- ==================================================
       一、公共样式
  =================================================== -->

  <link
    rel="stylesheet"
    href="../css/theme.css"
  >

  <link
    rel="stylesheet"
    href="../css/base.css"
  >

  <link
    rel="stylesheet"
    href="../css/header.css"
  >

  <link
    rel="stylesheet"
    href="../css/footer.css"
  >


  <!-- ==================================================
       二、新建作品页面样式
  =================================================== -->

  <link
    rel="stylesheet"
    href="../page-css/create.css"
  >

</head>


<body>

  <div id="app">


    <!-- ==================================================
         三、顶部栏
    =================================================== -->

    <header
      class="app-header"
      id="app-header"
    >

      <div class="app-header__brand">

        <span class="app-header__brand-name">
          写作软件
        </span>

      </div>


      <div class="app-header__actions">

        <button
          class="app-header__button app-header__button--settings"
          id="cancel-create-top"
          type="button"
        >
          返回书架
        </button>

      </div>

    </header>


    <!-- ==================================================
         四、主要内容区域
    =================================================== -->

    <main
      class="app-main create-main"
      id="app-main"
    >

      <section
        class="create-page"
        id="create-page"
        aria-labelledby="create-page-title"
      >


        <!-- 页面标题 -->

        <div class="create-page__heading">

          <p class="create-page__eyebrow">
            BEGIN A NEW STORY
          </p>

          <h1
            class="create-page__title"
            id="create-page-title"
          >
            新建作品
          </h1>

          <div
            class="create-page__divider"
            aria-hidden="true"
          ></div>

          <p class="create-page__subtitle">
            为你的故事立卷，开启新的创作。
          </p>

        </div>


        <!-- ==================================================
             五、作品创建表单
        =================================================== -->

        <form
          class="create-form"
          id="create-book-form"
          novalidate
        >


          <!-- 作品名称 -->

          <div class="create-form__field">

            <label
              class="create-form__label"
              for="book-title"
            >
              作品名称

              <span
                class="create-form__required"
                aria-hidden="true"
              >
                *
              </span>

            </label>


            <input
              class="create-form__input"
              id="book-title"
              name="title"
              type="text"
              placeholder="请输入作品名称"
              maxlength="100"
              autocomplete="off"
              required
              aria-describedby="book-title-help book-title-error"
            >


            <div class="create-form__field-footer">

              <p
                class="create-form__help"
                id="book-title-help"
              >
                为你的故事取一个名字。
              </p>

              <span
                class="create-form__counter"
                id="book-title-counter"
                aria-live="polite"
              >
                0 / 100
              </span>

            </div>


            <p
              class="create-form__error"
              id="book-title-error"
              hidden
            ></p>

          </div>


          <!-- 作品简介 -->

          <div class="create-form__field">

            <label
              class="create-form__label"
              for="book-description"
            >
              作品简介

              <span class="create-form__optional">
                选填
              </span>

            </label>


            <textarea
              class="create-form__textarea"
              id="book-description"
              name="description"
              placeholder="写下这个故事的背景、主题或创作构想……"
              maxlength="2000"
              rows="6"
              aria-describedby="book-description-help book-description-counter"
            ></textarea>


            <div class="create-form__field-footer">

              <p
                class="create-form__help"
                id="book-description-help"
              >
                可以介绍故事背景、主要人物或世界观。
              </p>

              <span
                class="create-form__counter"
                id="book-description-counter"
                aria-live="polite"
              >
                0 / 2000
              </span>

            </div>

          </div>


          <!-- 创建结果提示 -->

          <div
            class="create-form__message"
            id="create-message"
            role="status"
            aria-live="polite"
            hidden
          ></div>


          <!-- 表单操作 -->

          <div class="create-form__actions">

            <button
              class="create-form__button create-form__button--cancel"
              id="cancel-create"
              type="button"
            >
              取消
            </button>


            <button
              class="create-form__button create-form__button--submit"
              id="create-book-submit"
              type="submit"
            >

              <span
                class="create-form__button-icon"
                aria-hidden="true"
              >
                ＋
              </span>

              创建作品

            </button>

          </div>


          <!-- 必填提示 -->

          <p class="create-form__footnote">
            <span aria-hidden="true">*</span>
            为必填项目。作品创建后，可以继续编辑和完善。
          </p>

        </form>

      </section>

    </main>


    <!-- ==================================================
         六、底部导航
    =================================================== -->

    <footer
      class="app-footer"
      id="app-footer"
    >

      <nav
        class="bottom-nav"
        aria-label="主导航"
      >


        <!-- 书架 -->

        <a
          class="bottom-nav__item"
          href="../index.html"
          aria-label="书架"
        >

          <svg
            class="bottom-nav__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"
            ></path>

            <path
              d="M4 5.5v16"
            ></path>

            <path
              d="M8 7h8"
            ></path>

            <path
              d="M8 11h8"
            ></path>

          </svg>

          <span class="bottom-nav__label">
            书架
          </span>

        </a>


        <!-- 工具 -->

        <a
          class="bottom-nav__item"
          href="./tools.html"
          aria-label="工具"
        >

          <svg
            class="bottom-nav__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M14 6.5a5 5 0 0 0-6.5 6.5L3 17.5 6.5 21l4.5-4.5a5 5 0 0 0 6.5-6.5L14 13l-3-3z"
            ></path>

            <path
              d="m14 6.5 3.5-3.5 3.5 3.5-3.5 3.5"
            ></path>

          </svg>

          <span class="bottom-nav__label">
            工具
          </span>

        </a>

      </nav>

    </footer>


  </div>


  <!-- ==================================================
       七、公共 JavaScript
  =================================================== -->

  <script
    src="../js/storage.js"
    defer
  ></script>

  <script
    src="../js/navigation.js"
    defer
  ></script>

  <script
    src="../js/components.js"
    defer
  ></script>


  <!-- ==================================================
       八、新建作品页面逻辑
  =================================================== -->

  <script
    src="../page-js/create.js"
    defer
  ></script>


</body>

</html>
