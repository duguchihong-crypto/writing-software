<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- ==================================================
         一、基础信息
    ================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#9E2428"
    >

    <meta
        name="description"
        content="一款采用传统五色国风设计的写作软件，用于创作小说、整理大纲、管理人物与构建世界。"
    >

    <meta name="color-scheme" content="light">

    <title>写作软件 · 书架</title>


    <!-- ==================================================
         二、公共样式
         负责全站通用的视觉规范与组件样式
    ================================================== -->

    <!-- 五色主题变量 -->
    <link
        rel="stylesheet"
        href="./css/theme.css"
    >

    <!-- 全局基础样式 -->
    <link
        rel="stylesheet"
        href="./css/base.css"
    >

    <!-- 顶部导航栏 -->
    <link
        rel="stylesheet"
        href="./css/header.css"
    >

    <!-- 底部导航栏 -->
    <link
        rel="stylesheet"
        href="./css/footer.css"
    >


    <!-- ==================================================
         三、首页专属样式
         只负责书架页面的布局与内容
    ================================================== -->

    <link
        rel="stylesheet"
        href="./page-css/home.css"
    >


    <!-- ==================================================
         四、公共功能模块
         使用 defer，按照 HTML 中的顺序执行
    ================================================== -->

    <!-- 作品数据与本地存储 -->
    <script
        src="./js/storage.js"
        defer
    ></script>

    <!-- 页面导航功能 -->
    <script
        src="./js/navigation.js"
        defer
    ></script>

    <!-- 公共组件功能 -->
    <script
        src="./js/components.js"
        defer
    ></script>


    <!-- ==================================================
         五、首页专属功能
    ================================================== -->

    <!-- 书架展示、作品列表与空状态切换 -->
    <script
        src="./page-js/home.js"
        defer
    ></script>

</head>


<body>

    <!-- ==================================================
         软件主体
    ================================================== -->

    <div
        class="app"
        id="app"
    >


        <!-- ==================================================
             一、顶部导航栏
             主题：朱红
        ================================================== -->

        <header
            class="app-header"
            id="app-header"
        >

            <!-- ------------------------------------------
                 1.1 软件名称
            ------------------------------------------- -->

            <div class="app-header__brand">

                <a
                    class="app-header__brand-link"
                    href="./index.html"
                    aria-label="写作软件首页"
                >

                    <span class="app-header__brand-name">
                        写作软件
                    </span>

                </a>

            </div>


            <!-- ------------------------------------------
                 1.2 顶部操作区
            ------------------------------------------- -->

            <div class="app-header__actions">

                <!-- 新建作品：青色按钮 -->

                <a
                    class="app-header__button app-header__button--create"
                    href="./pages/create.html"
                    aria-label="新建作品"
                >

                    <span
                        class="app-header__button-icon"
                        aria-hidden="true"
                    >＋</span>

                    <span class="app-header__button-text">
                        新建
                    </span>

                </a>


                <!-- 软件设置：白色按钮 -->

                <a
                    class="app-header__button app-header__button--settings"
                    href="./pages/settings.html"
                    aria-label="软件设置"
                >

                    <span class="app-header__button-text">
                        设置
                    </span>

                </a>

            </div>

        </header>



        <!-- ==================================================
             二、页面主体
             位于顶部导航栏与底部导航栏之间
        ================================================== -->

        <main
            class="app-main"
            id="app-main"
        >

            <!-- ==================================================
                 书架页面
                 首页本身就是书架
            ================================================== -->

            <section
                class="home-page"
                id="home-page"
                aria-label="书架"
            >


                <!-- ==========================================
                     2.1 空书架状态

                     没有作品时显示。
                     有作品时由 home.js 隐藏。
                =========================================== -->

                <section
                    class="empty-state"
                    id="empty-state"
                    aria-labelledby="empty-state-title"
                >

                    <!-- 主标题 -->

                    <h1
                        class="empty-state__title"
                        id="empty-state-title"
                    >
                        卷帙未启
                    </h1>


                    <!-- 装饰分隔线 -->

                    <div
                        class="empty-state__divider"
                        aria-hidden="true"
                    >

                        <span
                            class="empty-state__divider-line"
                        ></span>

                        <span
                            class="empty-state__divider-symbol"
                        >◆</span>

                        <span
                            class="empty-state__divider-line"
                        ></span>

                    </div>


                    <!-- 空书架提示 -->

                    <p class="empty-state__subtitle">
                        书架尚空，静候新篇。
                    </p>


                    <!-- 空书架引导 -->

                    <p class="empty-state__description">
                        此间尚无作品，不妨挥毫落墨，<br>
                        写下你的第一个故事。
                    </p>

                </section>



                <!-- ==========================================
                     2.2 作品列表

                     有作品时显示。
                     没有作品时隐藏。
                =========================================== -->

                <section
                    class="shelf-content"
                    id="shelf-content"
                    aria-label="我的作品"
                    hidden
                >

                    <!-- 作品区域标题 -->

                    <div class="shelf-content__header">

                        <h2 class="shelf-content__title">
                            我的作品
                        </h2>


                        <!-- 作品数量 -->

                        <span
                            class="shelf-content__count"
                            id="shelf-count"
                            aria-live="polite"
                        >
                            0 部作品
                        </span>

                    </div>


                    <!-- 作品列表 -->

                    <div
                        class="shelf-list"
                        id="shelf-list"
                        aria-label="作品列表"
                    >

                        <!--
                            作品卡片由 page-js/home.js 动态生成。
                            不在 HTML 中预先写入虚构作品。
                        -->

                    </div>

                </section>


            </section>

        </main>



        <!-- ==================================================
             三、底部导航栏
             主题：玄黑与鎏金
        ================================================== -->

        <footer
            class="app-footer"
            id="app-footer"
        >

            <nav
                class="bottom-nav"
                aria-label="主导航"
            >


                <!-- ==========================================
                     3.1 书架入口

                     当前页面为书架。
                     使用鎏金边框表示选中状态。
                =========================================== -->

                <a
                    class="bottom-nav__item bottom-nav__item--active"
                    href="./index.html"
                    aria-current="page"
                    aria-label="书架"
                >

                    <!-- 书架图标 -->

                    <svg
                        class="bottom-nav__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22Z"
                        ></path>

                        <path
                            d="M4 5.5V22"
                        ></path>

                        <path
                            d="M8 7h8"
                        ></path>

                        <path
                            d="M8 11h8"
                        ></path>

                    </svg>


                    <!-- 入口文字 -->

                    <span class="bottom-nav__label">
                        书架
                    </span>

                </a>



                <!-- ==========================================
                     3.2 工具入口

                     进入工具中心。
                     选中状态由工具页面自行控制。
                =========================================== -->

                <a
                    class="bottom-nav__item"
                    href="./pages/tools.html"
                    aria-label="工具"
                >

                    <!-- 工具图标 -->

                    <svg
                        class="bottom-nav__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="8.5"
                        ></circle>

                        <path
                            d="M14.5 9.5 13 13l-3.5 1.5L11 11Z"
                        ></path>

                    </svg>


                    <!-- 入口文字 -->

                    <span class="bottom-nav__label">
                        工具
                    </span>

                </a>


            </nav>

        </footer>


    </div>

</body>

</html>
