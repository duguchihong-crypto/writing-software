<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- ==================== 基础信息 ==================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#9E2428"
    >

    <meta
        name="description"
        content="一款采用传统五色国风设计的写作软件。"
    >

    <title>写作软件 · 书架</title>


    <!-- ==================== 公共样式 ==================== -->

    <link
        rel="stylesheet"
        href="./css/theme.css"
    >

    <link
        rel="stylesheet"
        href="./css/base.css"
    >

    <link
        rel="stylesheet"
        href="./css/header.css"
    >

    <link
        rel="stylesheet"
        href="./css/footer.css"
    >


    <!-- ==================== 首页专属样式 ==================== -->

    <link
        rel="stylesheet"
        href="./page-css/home.css"
    >


    <!-- ==================== 公共功能 ==================== -->

    <script
        src="./js/storage.js"
        defer
    ></script>

    <script
        src="./js/navigation.js"
        defer
    ></script>

    <script
        src="./js/components.js"
        defer
    ></script>


    <!-- ==================== 首页专属功能 ==================== -->

    <script
        src="./page-js/home.js"
        defer
    ></script>

</head>


<body>

    <!-- ==================================================
         软件主体
    ================================================== -->

    <div
        class="app"
        id="app"
    >


        <!-- ==================================================
             一、顶部导航栏
             朱红色背景
        ================================================== -->

        <header
            class="app-header"
            id="app-header"
        >

            <!-- 软件名称 -->

            <div class="app-header__brand">

                <span class="app-header__brand-name">
                    写作软件
                </span>

            </div>


            <!-- 顶部操作区 -->

            <div class="app-header__actions">

                <!-- 新建作品 -->

                <a
                    class="app-header__button app-header__button--create"
                    href="./pages/create.html"
                    aria-label="新建作品"
                >

                    <span
                        class="app-header__button-icon"
                        aria-hidden="true"
                    >
                        ＋
                    </span>

                    <span>
                        新建
                    </span>

                </a>


                <!-- 软件设置 -->

                <a
                    class="app-header__button app-header__button--settings"
                    href="./pages/settings.html"
                    aria-label="软件设置"
                >

                    <span>
                        设置
                    </span>

                </a>

            </div>

        </header>



        <!-- ==================================================
             二、页面内容区域
             顶部栏与底部栏之间
        ================================================== -->

        <main
            class="app-main"
            id="app-main"
        >


            <!-- ==================================================
                 书架页面
                 首页本身就是书架
            ================================================== -->

            <section
                class="home-page"
                id="home-page"
                aria-label="书架"
            >


                <!-- ==========================================
                     2.1 空书架状态

                     没有作品时显示。
                     有作品时由首页 JavaScript 隐藏。
                =========================================== -->

                <section
                    class="empty-state"
                    id="empty-state"
                    aria-labelledby="empty-state-title"
                >

                    <!-- 空书架主标题 -->

                    <h1
                        class="empty-state__title"
                        id="empty-state-title"
                    >
                        卷帙未启
                    </h1>


                    <!-- 装饰分隔线 -->

                    <div
                        class="empty-state__divider"
                        aria-hidden="true"
                    >

                        <span class="empty-state__divider-line"></span>

                        <span class="empty-state__divider-symbol">
                            ◆
                        </span>

                        <span class="empty-state__divider-line"></span>

                    </div>


                    <!-- 空书架提示 -->

                    <p class="empty-state__subtitle">
                        书架尚空，静候新篇。
                    </p>


                    <!-- 空书架引导 -->

                    <p class="empty-state__description">
                        此间尚无作品，不妨挥毫落墨，<br>
                        写下你的第一个故事。
                    </p>

                </section>



                <!-- ==========================================
                     2.2 作品列表

                     有作品时显示。
                     没有作品时隐藏。
                =========================================== -->

                <section
                    class="shelf-content"
                    id="shelf-content"
                    aria-label="我的作品"
                    hidden
                >

                    <!-- 作品区域标题 -->

                    <div class="shelf-content__header">

                        <h2 class="shelf-content__title">
                            我的作品
                        </h2>

                        <span
                            class="shelf-content__count"
                            id="shelf-count"
                        >
                            0 部作品
                        </span>

                    </div>


                    <!-- 作品列表容器 -->

                    <div
                        class="shelf-list"
                        id="shelf-list"
                    >

                        <!-- 作品卡片由首页 JavaScript 生成 -->

                    </div>

                </section>


            </section>


        </main>



        <!-- ==================================================
             三、底部导航栏
             玄黑色背景
        ================================================== -->

        <footer
            class="app-footer"
            id="app-footer"
        >

            <nav
                class="bottom-nav"
                aria-label="主导航"
            >


                <!-- ==========================================
                     3.1 书架入口

                     首页就是书架。
                     当前页面显示黄色选中框。
                =========================================== -->

                <a
                    class="bottom-nav__item bottom-nav__item--active"
                    href="./index.html"
                    aria-current="page"
                    aria-label="书架"
                >

                    <!-- 书架图标 -->

                    <svg
                        class="bottom-nav__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22Z"></path>

                        <path d="M4 5.5V22"></path>

                        <path d="M8 7h8"></path>

                        <path d="M8 11h8"></path>

                    </svg>


                    <!-- 入口文字 -->

                    <span class="bottom-nav__label">
                        书架
                    </span>

                </a>



                <!-- ==========================================
                     3.2 工具入口

                     点击后进入工具中心。
                     黄色选中框由工具页面负责显示。
                =========================================== -->

                <a
                    class="bottom-nav__item"
                    href="./pages/tools.html"
                    aria-label="工具"
                >

                    <!-- 工具图标 -->

                    <svg
                        class="bottom-nav__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="8.5"
                        ></circle>

                        <path d="M14.5 9.5 13 13l-3.5 1.5L11 11Z"></path>

                    </svg>


                    <!-- 入口文字 -->

                    <span class="bottom-nav__label">
                        工具
                    </span>

                </a>


            </nav>

        </footer>


    </div>


</body>

</html>
