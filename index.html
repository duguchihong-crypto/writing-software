<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#242522">

    <title>文墨 · 写作软件</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body class="home-page">

    <!-- 顶部固定栏 -->
    <header class="app-header">

        <a class="brand" href="index.html" aria-label="返回首页">
            <span class="brand-seal">文</span>

            <span class="brand-text">
                <span class="brand-title">文墨</span>
                <span class="brand-subtitle">写作 · 藏书 · 创作</span>
            </span>
        </a>

        <div class="header-actions">

            <a class="button button-primary"
               href="pages/create.html">
                <span class="button-symbol">＋</span>
                <span>新建</span>
            </a>

            <a class="button button-setting"
               href="pages/settings.html"
               aria-label="设置">
                <span class="setting-symbol">⚙</span>
                <span class="setting-text">设置</span>
            </a>

        </div>
    </header>


    <!-- 页面主体 -->
    <main class="home-main">

        <!-- 欢迎区域 -->
        <section class="hero">

            <div class="hero-decoration hero-decoration-left">「</div>

            <div class="hero-content">

                <div class="hero-kicker">
                    <span class="ornament-line"></span>
                    <span>执笔 · 造境 · 成章</span>
                    <span class="ornament-line"></span>
                </div>

                <h1>落笔成章</h1>

                <p class="hero-description">
                    一字一句，自成天地。
                </p>

                <div class="hero-seal">
                    <span>静</span>
                    <span>心</span>
                    <span>创</span>
                    <span>作</span>
                </div>

            </div>

            <div class="hero-decoration hero-decoration-right">」</div>

        </section>


        <!-- 创作入口 -->
        <section class="creation-section">

            <div class="section-heading">

                <div>
                    <span class="section-eyebrow">YOUR CREATIVE SPACE</span>
                    <h2>创作天地</h2>
                </div>

                <span class="section-mark">文</span>

            </div>

            <div class="creation-panel">

                <div class="creation-emblem">
                    <span>墨</span>
                </div>

                <div class="creation-copy">
                    <h3>让灵感，自成篇章</h3>
                    <p>从一个念头开始，构建属于你的故事世界。</p>
                </div>

                <a class="creation-button"
                   href="pages/create.html">
                    开始创作
                    <span>→</span>
                </a>

            </div>

        </section>


        <!-- 最近作品 -->
        <section class="recent-section">

            <div class="section-heading">

                <div>
                    <span class="section-eyebrow">RECENT WORKS</span>
                    <h2>最近作品</h2>
                </div>

                <a class="text-link" href="pages/shelf.html">
                    全部作品
                    <span>→</span>
                </a>

            </div>

            <div class="empty-state">

                <div class="empty-decoration">
                    <span class="empty-book">册</span>
                    <span class="empty-cloud">☁</span>
                </div>

                <h3>静候你的第一部作品</h3>

                <p>
                    新建一本作品，它便会在这里留下印记。
                </p>

                <a href="pages/create.html" class="empty-action">
                    ＋ 创建作品
                </a>

            </div>

        </section>


        <!-- 首页底部题记 -->
        <footer class="home-footer">
            <span class="footer-rule"></span>
            <p>以笔为舟，以墨为海。</p>
            <span class="footer-rule"></span>
        </footer>

    </main>


    <!-- 底部固定导航 -->
    <nav class="bottom-nav" aria-label="主导航">

        <a class="nav-item active"
           href="pages/shelf.html"
           aria-label="书架">

            <span class="nav-icon nav-icon-shelf">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5.5h16v14H4z"/>
                    <path d="M8 5.5v14M16 5.5v14"/>
                    <path d="M4 9h4M16 9h4"/>
                </svg>
            </span>

            <span class="nav-label">书架</span>
            <span class="nav-indicator"></span>

        </a>


        <a class="nav-item"
           href="pages/tools.html"
           aria-label="工具">

            <span class="nav-icon nav-icon-tools">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14.5 6.5a5 5 0 0 0-6.2 6.2L3.5 17.5a2.1 2.1 0 0 0 3 3l4.8-4.8a5 5 0 0 0 6.2-6.2l-3 3-3-3z"/>
                </svg>
            </span>

            <span class="nav-label">工具</span>
            <span class="nav-indicator"></span>

        </a>

    </nav>


    <script src="js/home.js"></script>

</body>
</html>
