<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- ==================================================
         一、基础信息
    ================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#9E2428"
    >

    <meta
        name="description"
        content="一款采用传统五色国风设计的写作软件，用于创作小说、整理大纲、管理人物与构建世界。"
    >

    <meta name="color-scheme" content="light">

    <title>写作软件 · 书架</title>


    <!-- ==================================================
         二、公共样式
    ================================================== -->

    <link rel="stylesheet" href="./css/theme.css">

    <link rel="stylesheet" href="./css/base.css">

    <link rel="stylesheet" href="./css/header.css">

    <link rel="stylesheet" href="./css/footer.css">


    <!-- ==================================================
         三、首页专属样式
    ================================================== -->

    <link rel="stylesheet" href="./page-css/home.css">


    <!-- ==================================================
         四、公共 JavaScript
    ================================================== -->

    <script src="./js/storage.js" defer></script>

    <!-- 分组存储模块 -->
    <script src="./js/groups-storage.js" defer></script>

    <script src="./js/navigation.js" defer></script>

    <script src="./js/components.js" defer></script>


    <!-- ==================================================
         五、首页 JavaScript
    ================================================== -->

    <script src="./page-js/home.js" defer></script>

</head>


<body>

    <!-- ==================================================
         软件主体
    ================================================== -->

    <div class="app" id="app">


        <!-- ==================================================
             一、顶部导航栏
        ================================================== -->

        <header class="app-header" id="app-header">

            <!-- 软件名称 -->

            <div class="app-header__brand">

                <a
                    class="app-header__brand-link"
                    href="./index.html"
                    aria-label="返回写作软件首页"
                >

                    <span class="app-header__brand-name">
                        写作软件
                    </span>

                </a>

            </div>


            <!-- 顶部操作区 -->

            <div class="app-header__actions">

                <!-- 新建作品 -->

                <a
                    class="app-header__button app-header__button--create"
                    href="./pages/create.html"
                    aria-label="新建作品"
                >

                    <span
                        class="app-header__button-icon"
                        aria-hidden="true"
                    >＋</span>

                    <span class="app-header__button-text">
                        新建
                    </span>

                </a>


                <!-- 设置 -->

                <a
                    class="app-header__button app-header__button--settings"
                    href="./pages/settings.html"
                    aria-label="软件设置"
                >

                    <span class="app-header__button-text">
                        设置
                    </span>

                </a>

            </div>

        </header>



        <!-- ==================================================
             二、中间页面主体
        ================================================== -->

        <main class="app-main" id="app-main">

            <!-- 书架页面 -->

            <section
                class="home-page"
                id="home-page"
                aria-label="书架"
            >


                <!-- ==========================================
                     2.1 空书架状态
                =========================================== -->

                <section
                    class="empty-state"
                    id="empty-state"
                    aria-labelledby="empty-state-title"
                >

                    <h1
                        class="empty-state__title"
                        id="empty-state-title"
                    >
                        卷帙未启
                    </h1>


                    <!-- 装饰分隔线 -->

                    <div
                        class="empty-state__divider"
                        aria-hidden="true"
                    >

                        <span
                            class="empty-state__divider-line"
                        ></span>

                        <span
                            class="empty-state__divider-symbol"
                        >◆</span>

                        <span
                            class="empty-state__divider-line"
                        ></span>

                    </div>


                    <!-- 空书架提示 -->

                    <p class="empty-state__subtitle">
                        书架尚空，静候新篇。
                    </p>


                    <!-- 空书架引导 -->

                    <p class="empty-state__description">
                        此间尚无作品，不妨挥毫落墨，<br>
                        写下你的第一个故事。
                    </p>

                </section>



                <!-- ==========================================
                     2.2 我的分组
                =========================================== -->

                <section
                    class="home-groups"
                    id="home-groups"
                    aria-label="我的分组"
                    hidden
                >

                    <!-- 分组区域标题 -->

                    <div class="home-groups__header">

                        <h2 class="home-groups__title">
                            我的分组
                        </h2>

                        <span
                            class="home-groups__count"
                            id="home-groups-count"
                            aria-live="polite"
                        >
                            0 个分组
                        </span>

                    </div>


                    <!-- 分组卡片容器 -->

                    <div
                        class="home-groups__list"
                        id="home-groups-list"
                        aria-label="分组列表"
                    >

                        <!--
                            分组卡片由 home.js 动态生成。
                        -->

                    </div>

                </section>



                <!-- ==========================================
                     2.3 作品列表
                =========================================== -->

                <section
                    class="shelf-content"
                    id="shelf-content"
                    aria-label="我的作品"
                    hidden
                >

                    <!-- 作品区域标题 -->

                    <div class="shelf-content__header">

                        <h2 class="shelf-content__title">
                            我的作品
                        </h2>

                        <span
                            class="shelf-content__count"
                            id="shelf-count"
                            aria-live="polite"
                        >
                            0 部作品
                        </span>

                    </div>


                    <!-- 作品卡片容器 -->

                    <div
                        class="shelf-list"
                        id="shelf-list"
                        aria-label="作品列表"
                    >

                        <!--
                            作品卡片由 home.js 动态生成。
                        -->

                    </div>

                </section>


            </section>

        </main>



        <!-- ==================================================
             三、底部导航栏
        ================================================== -->

        <footer class="app-footer" id="app-footer">

            <nav
                class="bottom-nav"
                aria-label="主导航"
            >


                <!-- ==========================================
                     3.1 书架
                =========================================== -->

                <a
                    class="bottom-nav__item bottom-nav__item--active"
                    href="./index.html"
                    aria-current="page"
                    aria-label="书架"
                >

                    <svg
                        class="bottom-nav__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22Z"
                        ></path>

                        <path d="M4 5.5V22"></path>

                        <path d="M8 7h8"></path>

                        <path d="M8 11h8"></path>

                    </svg>


                    <span class="bottom-nav__label">
                        书架
                    </span>

                </a>



                <!-- ==========================================
                     3.2 工具
                =========================================== -->

                <a
                    class="bottom-nav__item"
                    href="./pages/tools.html"
                    aria-label="工具"
                >

                    <svg
                        class="bottom-nav__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="8.5"
                        ></circle>

                        <path
                            d="M14.5 9.5 13 13l-3.5 1.5L11 11Z"
                        ></path>

                    </svg>


                    <span class="bottom-nav__label">
                        工具
                    </span>

                </a>


            </nav>

        </footer>


    </div>

</body>

</html>
