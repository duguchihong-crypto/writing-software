<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#241c1a">

    <title>写作软件</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
    <div class="app-shell">

        <!-- 顶部固定栏 -->
        <header class="topbar">
            <a class="brand" href="index.html" aria-label="写作软件首页">
                <span class="brand-seal">文</span>

                <span class="brand-name">
                    <span class="brand-title">写作软件</span>
                    <span class="brand-subtitle">落笔成章 · 笔墨生华</span>
                </span>
            </a>

            <div class="topbar-actions">
                <a class="action-button action-create"
                   href="pages/create.html">
                    <span class="action-symbol">＋</span>
                    <span>新建</span>
                </a>

                <a class="action-button action-settings"
                   href="pages/settings.html">
                    <span class="settings-symbol">⚙</span>
                    <span>设置</span>
                </a>
            </div>
        </header>

        <!-- 主体内容 -->
        <main class="main-content">

            <!-- 首页欢迎区域 -->
            <section class="welcome-panel">
                <div class="welcome-decoration decoration-left">❖</div>

                <div class="welcome-content">
                    <p class="welcome-kicker">THE ART OF WRITING</p>

                    <h1>笔墨之间，自有天地</h1>

                    <p class="welcome-description">
                        以文字为舟，载万千故事。
                    </p>

                    <div class="welcome-divider">
                        <span></span>
                        <i>✦</i>
                        <span></span>
                    </div>
                </div>

                <div class="welcome-decoration decoration-right">❖</div>
            </section>

            <!-- 快捷操作 -->
            <section class="quick-section">
                <div class="section-heading">
                    <div>
                        <span class="section-eyebrow">QUICK ACCESS</span>
                        <h2>快捷入口</h2>
                    </div>

                    <span class="section-seal">文房</span>
                </div>

                <div class="quick-grid">

                    <a class="quick-card card-shelf"
                       href="pages/shelf.html">
                        <span class="quick-icon icon-shelf">卷</span>

                        <span class="quick-text">
                            <strong>我的书架</strong>
                            <small>收纳每一篇故事</small>
                        </span>

                        <span class="quick-arrow">↗</span>
                    </a>

                    <a class="quick-card card-tools"
                       href="pages/tools.html">
                        <span class="quick-icon icon-tools">策</span>

                        <span class="quick-text">
                            <strong>写作工具</strong>
                            <small>让构思井然有序</small>
                        </span>

                        <span class="quick-arrow">↗</span>
                    </a>

                </div>
            </section>

            <!-- 最近创作 -->
            <section class="recent-section">
                <div class="section-heading">
                    <div>
                        <span class="section-eyebrow">RECENT WORK</span>
                        <h2>最近创作</h2>
                    </div>

                    <a class="text-link" href="pages/shelf.html">
                        查看书架 <span>→</span>
                    </a>
                </div>

                <div class="empty-state">
                    <div class="empty-illustration">
                        <span class="empty-circle"></span>
                        <span class="empty-book">卷</span>
                    </div>

                    <h3>静候你的第一篇作品</h3>

                    <p>
                        灵感落于纸上，故事由此开始。
                    </p>

                    <a class="primary-button"
                       href="pages/create.html">
                        <span>＋</span>
                        创建新作品
                    </a>
                </div>
            </section>

        </main>

        <!-- 底部固定导航 -->
        <nav class="bottom-nav" aria-label="主导航">

            <a class="nav-item active"
               href="index.html"
               aria-current="page">
                <span class="nav-icon">⌂</span>
                <span class="nav-label">首页</span>
                <span class="nav-indicator"></span>
            </a>

            <a class="nav-item"
               href="pages/shelf.html">
                <span class="nav-icon">▤</span>
                <span class="nav-label">书架</span>
                <span class="nav-indicator"></span>
            </a>

            <a class="nav-item"
               href="pages/tools.html">
                <span class="nav-icon">✧</span>
                <span class="nav-label">工具</span>
                <span class="nav-indicator"></span>
            </a>

        </nav>

    </div>

    <script src="js/home.js" defer></script>
    <script src="js/navigation.js" defer></script>
</body>
</html>
