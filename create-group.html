<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#9E2428"
    >

    <meta
        name="description"
        content="创建新的写作分组，整理你的书籍与作品。"
    >

    <title>新建分组 · 写作软件</title>


    <!-- ==================================================
         一、公共主题样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="../css/theme.css"
    >

    <link
        rel="stylesheet"
        href="../css/base.css"
    >


    <!-- ==================================================
         二、公共导航样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="../css/header.css"
    >

    <link
        rel="stylesheet"
        href="../css/footer.css"
    >


    <!-- ==================================================
         三、当前页面样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="../page-css/create-group.css"
    >

</head>


<body>

    <div id="app">


        <!-- ==============================================
             一、顶部导航栏
        ============================================== -->

        <header class="app-header">

            <!-- 返回按钮 -->

            <div class="app-header__brand">

                <button
                    class="app-header__button app-header__button--settings"
                    id="cancel-create-group-top"
                    type="button"
                    aria-label="返回新建选择页"
                >
                    <span aria-hidden="true">←</span>

                    <span>返回</span>
                </button>

            </div>


            <!-- 页面操作 -->

            <div class="app-header__actions">

                <span class="create-group-header__label">
                    新建分组
                </span>

            </div>

        </header>



        <!-- ==============================================
             二、页面主体
        ============================================== -->

        <main class="app-main">

            <section class="create-group-page">


                <!-- ======================================
                     2.1 页面标题
                ====================================== -->

                <header class="create-group-heading">

                    <div
                        class="create-group-heading__ornament"
                        aria-hidden="true"
                    >
                        ✦
                    </div>

                    <h1 class="create-group-heading__title">
                        新建分组
                    </h1>

                    <p class="create-group-heading__subtitle">
                        分类整理，让每一部作品各有归处。
                    </p>

                    <div
                        class="create-group-heading__divider"
                        aria-hidden="true"
                    ></div>

                </header>



                <!-- ======================================
                     2.2 分组表单
                ====================================== -->

                <form
                    class="create-group-form"
                    id="create-group-form"
                    novalidate
                >


                    <!-- 分组图标 -->

                    <div
                        class="create-group-emblem"
                        aria-hidden="true"
                    >

                        <div class="create-group-emblem__outer">

                            <div class="create-group-emblem__inner">

                                <span>卷</span>

                            </div>

                        </div>

                    </div>



                    <!-- 分组名称 -->

                    <div class="create-group-field">

                        <label
                            class="create-group-field__label"
                            for="group-name"
                        >
                            分组名称

                            <span
                                class="create-group-field__required"
                                aria-label="必填"
                            >
                                *
                            </span>

                        </label>


                        <div class="create-group-field__input-wrap">

                            <input
                                class="create-group-field__input"
                                id="group-name"
                                name="groupName"
                                type="text"
                                placeholder="请输入分组名称"
                                maxlength="50"
                                autocomplete="off"
                                required
                                aria-describedby="group-name-help group-name-error"
                            >

                            <span
                                class="create-group-field__counter"
                                id="group-name-counter"
                                aria-live="polite"
                            >
                                0 / 50
                            </span>

                        </div>


                        <p
                            class="create-group-field__help"
                            id="group-name-help"
                        >
                            为你的作品分类，例如：奇幻小说、历史架空、短篇集。
                        </p>


                        <p
                            class="create-group-field__error"
                            id="group-name-error"
                            role="alert"
                            hidden
                        ></p>

                    </div>



                    <!-- 提示信息 -->

                    <div
                        class="create-group-message"
                        id="create-group-message"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></div>



                    <!-- ==================================
                         2.3 操作按钮
                    ================================== -->

                    <div class="create-group-actions">


                        <!-- 取消 -->

                        <button
                            class="create-group-actions__button create-group-actions__button--cancel"
                            id="cancel-create-group"
                            type="button"
                        >
                            取消
                        </button>


                        <!-- 创建 -->

                        <button
                            class="create-group-actions__button create-group-actions__button--submit"
                            id="create-group-submit"
                            type="submit"
                        >
                            <span
                                class="create-group-actions__icon"
                                aria-hidden="true"
                            >
                                ＋
                            </span>

                            <span>创建分组</span>
                        </button>

                    </div>


                </form>



                <!-- ======================================
                     2.4 页面底部说明
                ====================================== -->

                <aside class="create-group-note">

                    <span
                        class="create-group-note__icon"
                        aria-hidden="true"
                    >
                        ◈
                    </span>

                    <p>
                        分组用于整理书籍，不会改变作品本身的内容。
                    </p>

                </aside>


            </section>

        </main>



        <!-- ==============================================
             三、底部导航栏
        ============================================== -->

        <footer class="app-footer">

            <nav
                class="bottom-nav"
                aria-label="主导航"
            >

                <!-- 书架 -->

                <a
                    class="bottom-nav__item"
                    href="../index.html"
                    data-route="home"
                >

                    <span
                        class="bottom-nav__icon"
                        aria-hidden="true"
                    >
                        ◫
                    </span>

                    <span class="bottom-nav__label">
                        书架
                    </span>

                </a>


                <!-- 工具 -->

                <a
                    class="bottom-nav__item"
                    href="./tools.html"
                    data-route="tools"
                >

                    <span
                        class="bottom-nav__icon"
                        aria-hidden="true"
                    >
                        ⚒
                    </span>

                    <span class="bottom-nav__label">
                        工具
                    </span>

                </a>

            </nav>

        </footer>


    </div>



    <!-- ==============================================
         四、公共 JavaScript
    ============================================== -->

    <script src="../js/storage.js"></script>

    <script src="../js/navigation.js"></script>

    <script src="../js/components.js"></script>


    <!-- ==============================================
         五、当前页面 JavaScript
    ============================================== -->

    <script src="../page-js/create-group.js"></script>

</body>

</html>
