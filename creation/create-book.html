<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8f2929">

    <title>新建书籍 - 写作软件</title>

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../page-css/create-book.css">
</head>

<body>

<div id="app" class="app create-book-app">

    <!-- =========================
         顶部导航
    ========================== -->

    <header class="app-header" id="app-header">

        <div class="app-header__brand">
            <span class="app-header__brand-name">写作软件</span>
        </div>

        <div class="app-header__actions">

            <button
                type="button"
                class="app-header__button app-header__button--settings"
                id="cancel-create-book-top"
                aria-label="返回新建页面"
            >
                <span aria-hidden="true">←</span>
                <span>返回</span>
            </button>

        </div>

    </header>


    <!-- =========================
         页面主体
    ========================== -->

    <main class="create-book-main">

        <div class="create-book-container">

            <!-- 页面标题 -->

            <section class="create-book-heading">

                <div class="create-book-heading__ornament">
                    ✦
                </div>

                <h1 class="create-book-heading__title">
                    新建书籍
                </h1>

                <p class="create-book-heading__subtitle">
                    创建属于你的文学作品
                </p>

                <div class="create-book-heading__divider">
                    <span></span>
                    <i>✦</i>
                    <span></span>
                </div>

            </section>


            <!-- =========================
                 新建书籍卡片
            ========================== -->

            <form
                id="create-book-form"
                class="create-book-form"
                novalidate
            >

                <!-- 卡片装饰 -->

                <div class="create-book-card__top-decoration">
                    <span></span>
                    <span>✦</span>
                    <span></span>
                </div>


                <!-- 书籍图标 -->

                <div class="create-book-emblem">
                    <span>书</span>
                </div>


                <!-- 书籍名称 -->

                <section class="create-book-section">

                    <label
                        class="create-book-field__label"
                        for="book-title"
                    >
                        书籍名称
                        <span class="required-mark">*</span>
                    </label>

                    <input
                        type="text"
                        id="book-title"
                        name="title"
                        class="create-book-field__input"
                        maxlength="100"
                        placeholder="请输入书籍名称"
                        autocomplete="off"
                        required
                    >

                    <div class="create-book-field-footer">

                        <p
                            id="book-title-error"
                            class="create-book-field__error"
                            hidden
                        ></p>

                        <span
                            id="book-title-counter"
                            class="create-book-counter"
                        >
                            0 / 100
                        </span>

                    </div>

                </section>


                <!-- 书籍封面 -->

                <section class="create-book-section create-book-cover-section">

                    <div class="create-book-section__heading">

                        <label class="create-book-field__label">
                            书籍封面
                        </label>

                        <span class="create-book-section__optional">
                            选填
                        </span>

                    </div>


                    <div class="create-book-cover">

                        <!-- 封面预览 -->

                        <div class="create-book-cover__preview">

                            <div
                                id="cover-placeholder"
                                class="create-book-cover__placeholder"
                            >

                                <div class="create-book-cover__placeholder-border">

                                    <span class="create-book-cover__placeholder-icon">
                                        书
                                    </span>

                                    <span class="create-book-cover__placeholder-title">
                                        暂无封面
                                    </span>

                                    <span class="create-book-cover__placeholder-description">
                                        YOUR BOOK
                                    </span>

                                </div>

                            </div>


                            <img
                                id="cover-preview-image"
                                class="create-book-cover__image"
                                alt="书籍封面预览"
                                hidden
                            >

                        </div>


                        <!-- 封面操作 -->

                        <div class="create-book-cover__actions">

                            <label
                                for="book-cover-input"
                                id="cover-select-label"
                                class="create-book-cover__select-button"
                            >
                                <span>＋</span>
                                <span>选择封面</span>
                            </label>

                            <input
                                type="file"
                                id="book-cover-input"
                                name="cover"
                                accept="image/*"
                                hidden
                            >

                            <button
                                type="button"
                                id="remove-cover-button"
                                class="create-book-cover__remove-button"
                                hidden
                            >
                                移除封面
                            </button>

                        </div>

                    </div>


                    <p class="create-book-hint">
                        支持 JPG、PNG、WEBP 等常见图片格式，最大 10 MB。
                    </p>


                    <p
                        id="cover-error"
                        class="create-book-field__error"
                        hidden
                    ></p>

                </section>


                <!-- 消息提示 -->

                <div
                    id="create-book-message"
                    class="create-book-message"
                    hidden
                    aria-live="polite"
                ></div>


                <!-- 操作按钮 -->

                <section class="create-book-actions">

                    <button
                        type="button"
                        id="cancel-create-book"
                        class="create-book-cancel"
                    >
                        取消
                    </button>

                    <button
                        type="submit"
                        id="create-book-submit"
                        class="create-book-submit"
                    >
                        创建书籍
                    </button>

                </section>


                <!-- 卡片底部装饰 -->

                <div class="create-book-card__bottom-decoration">
                    <span>✦</span>
                </div>

            </form>

        </div>

    </main>


    <!-- =========================
         底部导航
    ========================== -->

    <footer class="app-footer" id="app-footer">

        <nav class="bottom-nav" aria-label="主导航">

            <a
                class="bottom-nav__item"
                href="../index.html"
                data-nav="home"
                aria-label="书架"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M3 10.5L12 3L21 10.5V20H14V14H10V20H3V10.5Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                    />
                </svg>

                <span class="bottom-nav__label">
                    书架
                </span>

            </a>


            <a
                class="bottom-nav__item"
                href="../pages/tools.html"
                data-nav="tools"
                aria-label="工具"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M12 3L14.2 8.8L20 11L14.2 13.2L12 19L9.8 13.2L4 11L9.8 8.8L12 3Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M19 16L20 18.5L22.5 19.5L20 20.5L19 23L18 20.5L15.5 19.5L18 18.5L19 16Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.2"
                        stroke-linejoin="round"
                    />
                </svg>

                <span class="bottom-nav__label">
                    工具
                </span>

            </a>

        </nav>

    </footer>

</div>


<!-- =========================================
     封面裁剪弹窗
========================================= -->

<div
    class="cover-crop-modal"
    id="cover-crop-modal"
    hidden
>

    <div
        class="cover-crop-modal__backdrop"
        id="cover-crop-backdrop"
        aria-hidden="true"
    ></div>


    <section
        class="cover-crop-dialog"
        id="cover-crop-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cover-crop-title"
        aria-describedby="cover-crop-instructions"
        tabindex="-1"
    >

        <!-- 标题 -->

        <header class="cover-crop-dialog__header">

            <div>

                <p class="cover-crop-dialog__eyebrow">
                    BOOK COVER
                </p>

                <h2
                    class="cover-crop-dialog__title"
                    id="cover-crop-title"
                >
                    裁剪封面
                </h2>

            </div>


            <button
                class="cover-crop-dialog__close"
                id="cover-crop-close"
                type="button"
                aria-label="关闭裁剪窗口"
            >
                ×
            </button>

        </header>


        <!-- 操作说明 -->

        <p
            class="cover-crop-dialog__instructions"
            id="cover-crop-instructions"
        >
            拖动图片调整显示位置，使用下方滑块缩放图片。
            裁剪框固定为 2:3 比例，确认后生成统一尺寸的封面。
        </p>


        <!-- 裁剪区域 -->

        <div
            class="cover-crop-stage"
            id="cover-crop-stage"
            aria-label="封面裁剪区域"
        >

            <img
                class="cover-crop-image"
                id="cover-crop-image"
                alt="正在裁剪的封面图片"
                draggable="false"
            >

            <div
                class="cover-crop-grid"
                aria-hidden="true"
            ></div>

        </div>


        <!-- 比例说明 -->

        <div class="cover-crop-ratio">

            <span class="cover-crop-ratio__label">
                封面比例
            </span>

            <span class="cover-crop-ratio__value">
                2 : 3
            </span>

            <span class="cover-crop-ratio__size">
                400 × 600
            </span>

        </div>


        <!-- 图片缩放 -->

        <div class="cover-crop-zoom">

            <label
                class="cover-crop-zoom__label"
                for="cover-crop-zoom"
            >
                图片缩放
            </label>


            <div class="cover-crop-zoom__controls">

                <button
                    class="cover-crop-zoom__icon"
                    id="cover-crop-zoom-out"
                    type="button"
                    aria-label="缩小图片"
                >
                    −
                </button>

                <input
                    class="cover-crop-zoom__slider"
                    id="cover-crop-zoom"
                    type="range"
                    min="1"
                    max="3"
                    step="0.01"
                    value="1"
                    aria-label="调整封面图片缩放比例"
                >

                <button
                    class="cover-crop-zoom__icon"
                    id="cover-crop-zoom-in"
                    type="button"
                    aria-label="放大图片"
                >
                    ＋
                </button>

            </div>


            <output
                class="cover-crop-zoom__value"
                id="cover-crop-zoom-value"
                for="cover-crop-zoom"
            >
                100%
            </output>

        </div>


        <!-- 裁剪按钮 -->

        <div class="cover-crop-dialog__actions">

            <button
                class="cover-crop-button cover-crop-button--reset"
                id="cover-crop-reset"
                type="button"
            >
                重置
            </button>


            <div class="cover-crop-dialog__actions-right">

                <button
                    class="cover-crop-button cover-crop-button--cancel"
                    id="cover-crop-cancel"
                    type="button"
                >
                    取消
                </button>

                <button
                    class="cover-crop-button cover-crop-button--confirm"
                    id="cover-crop-confirm"
                    type="button"
                >
                    确认裁剪
                </button>

            </div>

        </div>


        <!-- 错误提示 -->

        <p
            class="cover-crop-dialog__error"
            id="cover-crop-error"
            role="alert"
            hidden
        ></p>

    </section>

</div>


<!-- =========================================
     JavaScript
========================================= -->

<script src="../js/storage.js"></script>
<script src="../js/navigation.js"></script>
<script src="../page-js/create-book.js"></script>

</body>
</html>
