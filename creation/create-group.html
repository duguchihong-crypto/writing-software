<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#9E2428">
    <meta name="color-scheme" content="light">

    <meta
        name="description"
        content="创建新的写作分组，整理你的书籍与作品。"
    >

    <title>新建分组 · 写作软件</title>

    <!-- ==============================
         公共样式
    ============================== -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- ==============================
         当前页面样式
    ============================== -->
    <link rel="stylesheet" href="./css/create-group.css">

    <!-- ==============================
         取消按钮文字颜色
    ============================== -->
    <style>
        .create-group-button--cancel {
            color: #9E2428;
        }
    </style>

</head>

<body>

<div class="app" id="app">

    <!-- ==============================
         顶部导航栏
    ============================== -->
    <header class="app-header" id="app-header">

        <div class="app-header__brand">

            <a
                class="app-header__brand-link"
                href="../index.html"
                aria-label="返回写作软件首页"
            >
                <span class="app-header__brand-name">
                    写作软件
                </span>
            </a>

        </div>

        <div class="app-header__actions">

            <!-- 返回新建选择页 -->
            <button
                class="app-header__button app-header__button--settings"
                id="cancel-create-group-top"
                type="button"
                aria-label="返回新建选择页"
            >
                <span aria-hidden="true">←</span>
                <span>返回</span>
            </button>

        </div>

    </header>

    <!-- ==============================
         页面主体
    ============================== -->
    <main class="app-main">

        <section
            class="create-group-page"
            aria-labelledby="create-group-title"
        >

            <!-- ==============================
                 页面标题
            ============================== -->
            <header class="create-group-heading">

                <div
                    class="create-group-heading__ornament"
                    aria-hidden="true"
                >
                    ✦
                </div>

                <h1
                    class="create-group-heading__title"
                    id="create-group-title"
                >
                    新建分组
                </h1>

                <p class="create-group-heading__subtitle">
                    分类整理，让每一部作品各有归处。
                </p>

                <div
                    class="create-group-heading__divider"
                    aria-hidden="true"
                >
                    <span></span>
                </div>

            </header>

            <!-- ==============================
                 新建分组表单
            ============================== -->
            <form
                class="create-group-form"
                id="create-group-form"
                novalidate
            >

                <!-- 分组图章 -->
                <div
                    class="create-group-emblem"
                    aria-hidden="true"
                >
                    <span class="create-group-emblem__character">
                        组
                    </span>
                </div>

                <!-- ==============================
                     分组名称
                ============================== -->
                <div class="create-group-field">

                    <div class="create-group-field__label-row">

                        <label
                            class="create-group-field__label"
                            for="group-name"
                        >
                            分组名称

                            <span
                                class="create-group-field__required"
                                aria-hidden="true"
                            >
                                *
                            </span>
                        </label>

                        <span
                            class="create-group-field__counter"
                            id="group-name-counter"
                            aria-live="polite"
                        >
                            0 / 50
                        </span>

                    </div>

                    <input
                        class="create-group-field__input"
                        id="group-name"
                        name="groupName"
                        type="text"
                        placeholder="请输入分组名称"
                        maxlength="50"
                        autocomplete="off"
                        required
                        aria-describedby="group-name-help group-name-error"
                    >

                    <p
                        class="create-group-field__help"
                        id="group-name-help"
                    >
                        为你的作品分类，例如：奇幻小说、历史架空、短篇集。
                    </p>

                    <p
                        class="create-group-field__error"
                        id="group-name-error"
                        role="alert"
                        hidden
                    ></p>

                </div>

                <!-- ==============================
                     操作反馈
                ============================== -->
                <div
                    class="create-group-message"
                    id="create-group-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <!-- ==============================
                     操作按钮
                ============================== -->
                <div class="create-group-form__actions">

                    <!-- 取消 -->
                    <button
                        class="create-group-button create-group-button--cancel"
                        id="cancel-create-group"
                        type="button"
                    >
                        取消
                    </button>

                    <!-- 创建分组 -->
                    <button
                        class="create-group-button create-group-button--submit"
                        id="create-group-submit"
                        type="submit"
                    >
                        <span aria-hidden="true">＋</span>
                        <span>创建分组</span>
                    </button>

                </div>

            </form>

            <!-- ==============================
                 页面底部说明
            ============================== -->
            <aside class="create-group-note">

                <span
                    class="create-group-note__icon"
                    aria-hidden="true"
                >
                    ◈
                </span>

                <span>
                    分组用于整理书籍，不会改变作品本身的内容。
                </span>

            </aside>

        </section>

    </main>

    <!-- ==============================
         底部导航栏
         与首页统一使用相同 SVG 图标
    ============================== -->
    <footer class="app-footer" id="app-footer">

        <nav class="bottom-nav" aria-label="主导航">

            <!-- 书架 -->
            <a
                class="bottom-nav__item bottom-nav__item--active"
                href="../index.html"
                data-nav="home"
                aria-current="page"
                aria-label="书架"
            >

                <svg
                    class="bottom-nav__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22Z"></path>
                    <path d="M4 5.5V22"></path>
                    <path d="M8 7h8"></path>
                    <path d="M8 11h8"></path>
                </svg>

                <span class="bottom-nav__label">
                    书架
                </span>

            </a>

            <!-- 工具 -->
            <a
                class="bottom-nav__item"
                href="../pages/tools.html"
                data-nav="tools"
                aria-label="工具"
            >

                <svg
                    class="bottom-nav__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="8.5"></circle>
                    <path d="M14.5 9.5 13 13l-3.5 1.5L11 11Z"></path>
                </svg>

                <span class="bottom-nav__label">
                    工具
                </span>

            </a>

        </nav>

    </footer>

</div>

<!-- ==============================
     公共 JavaScript
============================== -->
<script src="../js/storage.js" defer></script>
<script src="../js/groups-storage.js" defer></script>
<script src="../js/navigation.js" defer></script>
<script src="../js/components.js" defer></script>

<!-- ==============================
     当前页面 JavaScript
============================== -->
<script src="./js/create-group.js" defer></script>

</body>
</html>
