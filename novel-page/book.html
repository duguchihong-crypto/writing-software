<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9E2428">
    <meta name="color-scheme" content="light">

    <title>新建</title>

    <!-- 公共样式 -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- 新建页面样式 -->
    <link rel="stylesheet" href="../page-css/create.css">

    <!-- 返回按钮样式 -->
    <style>
        .create-back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            color: #9E2428;
            background: #ffffff;
            border: 1px solid #e5dada;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .create-back-button:hover {
            background: #fff8f6;
        }

        .create-back-button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<div class="app" id="app">

    <!-- ==============================
         顶部导航栏
    ============================== -->
    <header class="app-header" id="app-header">

        <a
            href="../index.html"
            class="create-back-button"
            aria-label="返回书架"
        >
            ← 返回书架
        </a>

    </header>


    <!-- ==============================
         页面主体
    ============================== -->
    <main class="app-main create-main" id="app-main">

        <div class="create-page">

            <!-- 页面标题 -->
            <div class="create-page__heading">

                <p class="create-page__eyebrow">
                    CREATE
                </p>

                <h1 class="create-page__title">
                    新建
                </h1>

                <div class="create-page__divider">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <p class="create-page__subtitle">
                    选择你想创建的内容
                </p>

            </div>


            <!-- ==============================
                 新建选项
            ============================== -->
            <div class="create-options">

                <!-- 新建书籍 -->
                <a
                    href="../pages/create-book.html"
                    class="create-option create-option--book"
                >

                    <div class="create-option__icon">
                        <span>📖</span>
                    </div>

                    <div class="create-option__content">

                        <h2 class="create-option__title">
                            新建书籍
                        </h2>

                        <p class="create-option__description">
                            创建一本新的小说，开始你的写作。
                        </p>

                        <span class="create-option__detail">
                            CREATE BOOK
                        </span>

                    </div>

                    <span class="create-option__arrow">
                        →
                    </span>

                </a>


                <!-- 新建分组 -->
                <a
                    href="../pages/create-group.html"
                    class="create-option create-option--group"
                >

                    <div class="create-option__icon">
                        <span>📁</span>
                    </div>

                    <div class="create-option__content">

                        <h2 class="create-option__title">
                            新建分组
                        </h2>

                        <p class="create-option__description">
                            创建一个分组，整理和管理你的书籍。
                        </p>

                        <span class="create-option__detail">
                            CREATE GROUP
                        </span>

                    </div>

                    <span class="create-option__arrow">
                        →
                    </span>

                </a>

            </div>

        </div>

    </main>


    <!-- ==============================
         底部导航
    ============================== -->
    <footer class="app-footer" id="app-footer">

        <nav class="bottom-nav" aria-label="主导航">

            <!-- 书架 -->
            <a
                class="bottom-nav__item"
                href="../index.html"
                data-nav="home"
                aria-label="书架"
            >

                <svg
                    class="bottom-nav__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path
                        d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22Z"
                    ></path>

                    <path d="M4 5.5V22"></path>
                    <path d="M8 7h8"></path>
                    <path d="M8 11h8"></path>

                </svg>

                <span class="bottom-nav__label">
                    书架
                </span>

            </a>


            <!-- 工具 -->
            <a
                class="bottom-nav__item"
                href="../pages/tools.html"
                data-nav="tools"
                aria-label="工具"
            >

                <svg
                    class="bottom-nav__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="8.5"
                    ></circle>

                    <path
                        d="M14.5 9.5 13 13l-3.5 1.5L11 11Z"
                    ></path>

                </svg>

                <span class="bottom-nav__label">
                    工具
                </span>

            </a>

        </nav>

    </footer>

</div>


<!-- ==============================
     公共功能
============================== -->
<script src="../js/navigation.js" defer></script>

</body>
</html>
