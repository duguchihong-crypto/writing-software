<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>小说</title>

    <!-- 公共样式 -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- 小说页面样式 -->
    <link rel="stylesheet" href="./book.css">
</head>

<body>

    <div class="book-page">

        <!-- 顶部固定栏 -->
        <header class="book-header">

            <button id="back-to-shelf" class="header-back">
                ＜
            </button>

            <h1 id="book-title" class="header-title">
                小说
            </h1>

            <button id="open-create-menu" class="header-add">
                ＋
            </button>

        </header>


        <!-- 新建菜单 -->
        <div id="create-menu" class="create-menu hidden">

            <button data-create="volume">
                卷
            </button>

            <button data-create="part">
                篇
            </button>

            <button data-create="chapter">
                章
            </button>

            <button data-create="preface">
                序
            </button>

        </div>


        <!-- 主体内容 -->
        <main class="book-main">


            <!-- 全书目录 -->
            <section id="all-books-panel" class="book-panel">

                <div class="outline-header">
                    <h2>全书目录</h2>
                </div>

                <div id="book-outline" class="book-outline">

                    <!-- 目录由 book.js 自动生成 -->

                </div>

            </section>


            <!-- 书籍信息 -->
            <section id="book-info-panel"
                     class="book-panel hidden">

                <h2>书籍信息</h2>

                <div class="book-info-cover">
                    <img id="book-cover" src="" alt="小说封面">
                </div>

                <div class="book-info-item">
                    <label>书名</label>
                    <input
                        id="book-name"
                        type="text"
                        placeholder="请输入书名"
                    >
                </div>

                <div class="book-info-item">
                    <label>简介</label>
                    <textarea
                        id="book-description"
                        placeholder="请输入小说简介"
                    ></textarea>
                </div>

            </section>


            <!-- 章节正文编辑 -->
            <section id="chapter-editor-panel"
                     class="book-panel hidden">

                <button id="back-to-outline" class="back-outline">
                    ＜ 返回目录
                </button>

                <input
                    id="chapter-title"
                    class="chapter-title"
                    type="text"
                    placeholder="章节标题"
                >

                <textarea
                    id="chapter-content"
                    class="chapter-content"
                    placeholder="开始写作……"
                ></textarea>

                <div id="save-status" class="save-status">
                    自动保存
                </div>

            </section>

        </main>


        <!-- 底部固定栏 -->
        <footer class="book-footer">

            <button id="tab-all-books" class="footer-tab active">
                全书
            </button>

            <button id="tab-book-info" class="footer-tab">
                书籍
            </button>

        </footer>

    </div>


    <!-- 公共功能 -->
    <script src="../js/storage.js"></script>
    <script src="../js/navigation.js"></script>

    <!-- 小说页面功能 -->
    <script src="./book.js"></script>

</body>
</html>
